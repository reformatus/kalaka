<script type="module">
  // Renders ```mermaid code blocks as diagrams (GitHub's repo view does this natively).
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs';
  document.addEventListener('DOMContentLoaded', async () => {
    for (const block of document.querySelectorAll('div.language-mermaid, pre > code.language-mermaid')) {
      const host = block.tagName === 'CODE' ? block.parentElement : block;
      const pre = document.createElement('pre');
      pre.className = 'mermaid';
      pre.textContent = host.textContent;
      host.replaceWith(pre);
    }
    mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'strict' });
    await mermaid.run({ querySelector: 'pre.mermaid' });
  });
</script>
