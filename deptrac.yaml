deptrac:
  paths:
    - plugins/kalaka/src
    - plugins/kalaka-support/src
    - plugins/kalaka-divi4/src
    - plugins/kalaka-ranking/src
    - plugins/kalaka-extras/src
    - plugins/kalaka-price-ladder/src
  layers:
    - name: Foundation
      collectors:
        - type: classLike
          value: '^Kalaka\\Foundation\\(?!Api\\)'
    - name: Foundation Api
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Kalaka\\Foundation\\Api\\'
          must_not:
            - type: classLike
              value: '^Kalaka\\Foundation\\Api\\Money\\Money$'
            - type: classLike
              value: '^Kalaka\\Foundation\\Api\\Decision\\DecisionTables$'
    - name: Foundation Api Money
      collectors:
        - type: classLike
          value: '^Kalaka\\Foundation\\Api\\Money\\Money$'
    # The decisions table by name and the current-decision rule: only Foundation and the admin view query.
    - name: Decision tables
      collectors:
        - type: classLike
          value: '^Kalaka\\Foundation\\Api\\Decision\\DecisionTables$'
    - name: Events
      collectors:
        - type: classLike
          value: '^Kalaka\\Events\\(?!Api\\)'
    - name: Events Api
      collectors:
        - type: classLike
          value: '^Kalaka\\Events\\Api\\'
    - name: Forms
      collectors:
        - type: classLike
          value: '^Kalaka\\Forms\\(?!Api\\|Engine\\)'
    # Forms' host side of its Api: the facade and the event's values (Forms/AGENTS.md).
    - name: Forms Api
      collectors:
        - type: classLike
          value: '^Kalaka\\Forms\\Api\\(Forms|EventValues|AfterSubmit)$'
    # The form engine (Forms\Engine) and its contract: every other Forms\Api type, at its FQCN.
    - name: Forms Engine
      collectors:
        - type: classLike
          value: '^Kalaka\\Forms\\Engine\\'
    - name: Forms Engine Api
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Kalaka\\Forms\\Api\\'
          must_not:
            - type: classLike
              value: '^Kalaka\\Forms\\Api\\(Forms|EventValues|AfterSubmit)$'
    - name: ParticipantFields
      collectors:
        - type: classLike
          value: '^Kalaka\\ParticipantFields\\(?!Api\\)'
    - name: ParticipantFields Api
      collectors:
        - type: classLike
          value: '^Kalaka\\ParticipantFields\\Api\\'
    - name: Assignments
      collectors:
        - type: classLike
          value: '^Kalaka\\Assignments\\(?!Api\\)'
    - name: Assignments Api
      collectors:
        - type: classLike
          value: '^Kalaka\\Assignments\\Api\\'
    - name: Registrations
      collectors:
        - type: classLike
          value: '^Kalaka\\Registrations\\(?!Api\\)'
    - name: Registrations Api
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Kalaka\\Registrations\\Api\\'
          must_not:
            - type: classLike
              value: '^Kalaka\\Registrations\\Api\\RegistrationTables$'
            - type: classLike
              value: '^Kalaka\\Registrations\\Api\\(Registrations|RegistrationRead|Serials|FormSubmissions|SecretLinks)$'
    # Registrations' public readers of registration data. Admin reaches registration data only through the
    # view query, and full-access code through its own layer (engineering.md, "Static checks").
    - name: Registration data
      collectors:
        - type: classLike
          value: '^Kalaka\\Registrations\\Api\\(Registrations|RegistrationRead|Serials|FormSubmissions|SecretLinks)$'
    # Registrations' tables by name and the sorszám order: only Registrations and the admin view query
    # (engineering.md, "Static checks"; RegistrationTablesTest is the second guard, for table names in strings).
    - name: Registration tables
      collectors:
        - type: classLike
          value: '^Kalaka\\Registrations\\Api\\RegistrationTables$'
    - name: Pricing
      collectors:
        - type: classLike
          value: '^Kalaka\\Pricing\\(?!Api\\)'
    - name: Pricing Api
      collectors:
        - type: classLike
          value: '^Kalaka\\Pricing\\Api\\'
    - name: Ledger
      collectors:
        - type: classLike
          value: '^Kalaka\\Ledger\\(?!Api\\)'
    - name: Ledger Api
      collectors:
        - type: classLike
          value: '^Kalaka\\Ledger\\Api\\'
    - name: Payments
      collectors:
        - type: classLike
          value: '^Kalaka\\Payments\\(?!Api\\)'
    - name: Payments Api
      collectors:
        - type: classLike
          value: '^Kalaka\\Payments\\Api\\'
    - name: Mail
      collectors:
        - type: classLike
          value: '^Kalaka\\Mail\\(?!Api\\)'
    - name: Mail Api
      collectors:
        - type: classLike
          value: '^Kalaka\\Mail\\Api\\'
    - name: Portal
      collectors:
        - type: classLike
          value: '^Kalaka\\Portal\\(?!Api\\)'
    - name: Portal Api
      collectors:
        - type: classLike
          value: '^Kalaka\\Portal\\Api\\'
    - name: Admin
      collectors:
        - type: classLike
          value: '^Kalaka\\Admin\\(?!Api\\|FullAccess\\)'
    # The code paths that only full access runs (engineering.md, "Static checks"): the one Admin layer
    # besides the view query that may use Registrations' readers.
    - name: Full access
      collectors:
        - type: classLike
          value: '^Kalaka\\Admin\\FullAccess\\'
    - name: Admin Api
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Kalaka\\Admin\\Api\\'
          must_not:
            - type: classLike
              value: '^Kalaka\\Admin\\Api\\ViewQuery$'
    - name: View query
      collectors:
        - type: classLike
          value: '^Kalaka\\Admin\\Api\\ViewQuery$'
    - name: Support
      collectors:
        - type: classLike
          value: '^Kalaka\\Support\\(?!Api\\)'
    - name: Support Api
      collectors:
        - type: classLike
          value: '^Kalaka\\Support\\Api\\'
    - name: Divi4
      collectors:
        - type: classLike
          value: '^Kalaka\\Divi4\\(?!Api\\)'
    - name: Divi4 Api
      collectors:
        - type: classLike
          value: '^Kalaka\\Divi4\\Api\\'
    - name: Ranking
      collectors:
        - type: classLike
          value: '^Kalaka\\Ranking\\(?!Api\\)'
    - name: Ranking Api
      collectors:
        - type: classLike
          value: '^Kalaka\\Ranking\\Api\\'
    - name: Extras
      collectors:
        - type: classLike
          value: '^Kalaka\\Extras\\(?!Api\\)'
    - name: Extras Api
      collectors:
        - type: classLike
          value: '^Kalaka\\Extras\\Api\\'
    - name: PriceLadder
      collectors:
        - type: classLike
          value: '^Kalaka\\PriceLadder\\(?!Api\\)'
    - name: PriceLadder Api
      collectors:
        - type: classLike
          value: '^Kalaka\\PriceLadder\\Api\\'
    - name: Bundled brick/math
      collectors:
        - type: classLike
          value: '^Kalaka\\Vendor\\Brick\\Math\\'
    - name: WordPress
      collectors:
        - type: classLike
          value: '^(WP_|wpdb$)'
