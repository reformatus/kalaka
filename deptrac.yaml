deptrac:
  paths:
    - plugins/kalaka/src
    - plugins/kalaka-support/src
    - plugins/kalaka-divi4/src
  layers:
    - name: Foundation
      collectors:
        - type: classLike
          value: '^Kalaka\\Foundation\\(?!Api\\)'
    - name: Foundation Api
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Kalaka\\Foundation\\Api\\'
          must_not:
            - type: classLike
              value: '^Kalaka\\Foundation\\Api\\Money\\Money$'
    - name: Foundation Api Money
      collectors:
        - type: classLike
          value: '^Kalaka\\Foundation\\Api\\Money\\Money$'
    - name: Events
      collectors:
        - type: classLike
          value: '^Kalaka\\Events\\(?!Api\\)'
    - name: Events Api
      collectors:
        - type: classLike
          value: '^Kalaka\\Events\\Api\\'
    - name: Forms
      collectors:
        - type: classLike
          value: '^Kalaka\\Forms\\(?!Api\\)'
    - name: Forms Api
      collectors:
        - type: classLike
          value: '^Kalaka\\Forms\\Api\\'
    - name: Assignments
      collectors:
        - type: classLike
          value: '^Kalaka\\Assignments\\(?!Api\\)'
    - name: Assignments Api
      collectors:
        - type: classLike
          value: '^Kalaka\\Assignments\\Api\\'
    - name: Registrations
      collectors:
        - type: classLike
          value: '^Kalaka\\Registrations\\(?!Api\\)'
    - name: Registrations Api
      collectors:
        - type: classLike
          value: '^Kalaka\\Registrations\\Api\\'
    - name: Pricing
      collectors:
        - type: classLike
          value: '^Kalaka\\Pricing\\(?!Api\\)'
    - name: Pricing Api
      collectors:
        - type: classLike
          value: '^Kalaka\\Pricing\\Api\\'
    - name: Ledger
      collectors:
        - type: classLike
          value: '^Kalaka\\Ledger\\(?!Api\\)'
    - name: Ledger Api
      collectors:
        - type: classLike
          value: '^Kalaka\\Ledger\\Api\\'
    - name: Payments
      collectors:
        - type: classLike
          value: '^Kalaka\\Payments\\(?!Api\\)'
    - name: Payments Api
      collectors:
        - type: classLike
          value: '^Kalaka\\Payments\\Api\\'
    - name: Mail
      collectors:
        - type: classLike
          value: '^Kalaka\\Mail\\(?!Api\\)'
