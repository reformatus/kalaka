          value: '^Kalaka\\Admin\\(?!Api\\)'
    - name: Admin Api
      collectors:
        - type: classLike
          value: '^Kalaka\\Admin\\Api\\'
    - name: Support
      collectors:
        - type: classLike
          value: '^Kalaka\\Support\\(?!Api\\)'
    - name: Support Api
      collectors:
        - type: classLike
          value: '^Kalaka\\Support\\Api\\'
    - name: Divi4
      collectors:
        - type: classLike
          value: '^Kalaka\\Divi4\\(?!Api\\)'
    - name: Divi4 Api
      collectors:
        - type: classLike
          value: '^Kalaka\\Divi4\\Api\\'
    - name: Bundled brick/math
      collectors:
        - type: classLike
          value: '^Kalaka\\Vendor\\Brick\\Math\\'
    - name: WordPress
      collectors:
        - type: classLike
          value: '^(WP_|wpdb$)'
