name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-8.3-${{ hashFiles('**/composer.lock') }}
      - run: composer install --no-interaction --no-progress
      - name: Composer install in every plugin, core first
        run: |
          composer install --no-interaction --no-progress --working-dir=plugins/kalaka
          for manifest in plugins/*/composer.json; do
            dir="$(dirname "$manifest")"
            if [ "$dir" != plugins/kalaka ]; then
              composer install --no-interaction --no-progress --working-dir="$dir"
            fi
          done
      - run: vendor/bin/phpcs
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: vendor/bin/deptrac analyse --fail-on-uncovered
      - run: bin/check-version.sh

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-8.3-${{ hashFiles('**/composer.lock') }}
      - run: composer install --no-interaction --no-progress
      - name: Composer install in every plugin, core first
        run: |
          composer install --no-interaction --no-progress --working-dir=plugins/kalaka
          for manifest in plugins/*/composer.json; do
            dir="$(dirname "$manifest")"
            if [ "$dir" != plugins/kalaka ]; then
              composer install --no-interaction --no-progress --working-dir="$dir"
            fi
          done
      - run: vendor/bin/phpunit -c plugins/kalaka/phpunit.xml.dist --testdox

  integration:
    name: Integration (PHP ${{ matrix.php }}, MariaDB ${{ matrix.mariadb }})
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
        mariadb: ['11.8', '10.3']
    uses: ./.github/workflows/integration.yml
    with:
      php: ${{ matrix.php }}
      mariadb: ${{ matrix.mariadb }}

  zip:
    name: Plugin zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-8.3-${{ hashFiles('**/composer.lock') }}
      - run: bin/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: kalaka-zip
          path: dist/*.zip
          retention-days: 7
          if-no-files-found: error

  smoke:
    name: Playground smoke test
    needs: zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: kalaka-zip
          path: dist
      - run: bin/playground-smoke.sh dist/kalaka-*.zip
